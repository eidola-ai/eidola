# Tinfoil Container configuration for one Eidola inference node serving
# Qwen3.8-27B (weights 4fc667ee…, models/qwen/qwen3.8-27b.toml) on one
# NVIDIA B200, Intel TDX.
#
# The SHA-256 of this file is the deployment's MRCONFIGID: the guest refuses
# to boot under any other config, and the gateway pins that hash beside the
# MRTD of the release image `cvm-version` names (releases/trust/
# engine-enclaves.json, from `measure-engine-enclaves`). Any change here is a
# different engine identity, and needs a re-measure and a gateway release.
#
# Secrets are organisation-scoped and reach a container by their own names,
# so the node's carry a prefix: `EIDOLA_ENV_PREFIX` names it, and the node
# reads every variable under it. Its secrets are ENGINE_GATEWAY_TOKEN, the
# token the gateway's GATEWAY_ENGINE_TOKEN carries, and the OTLP endpoint and
# headers its telemetry goes to (empty, it exports none); none is measured,
# so setting or rotating one changes no identity.
#
# The weights pack is the modelwrap schema 1 pack of the repo below; its
# reference is reproducible from the repo at that revision (`modelwrap
# --schema 1 <repo>@<revision>`, the packer image of modelwrap v0.3.0).
#
# The sizing is the whole 262,144-position context at 64 seats, steps of
# 2,048 tokens of prefill chunks of 256 (the serving chunk), decode graphs on:
# what one B200 holds beside the weights and the CUDA executor's reserve, the
# state pool growing with the seats (eidola-common's
# `qwen_fits_one_b200_at_its_whole_context`).
#
# Platform release 0.15.4-rc.2+gpu was rebuilt from source on 2026-11-20 and every
# published file was byte-identical (docs/contributing/
# rebuilding-platform-images.md). Rebuild again, and update this note, when
# the version below changes.
cvm-version: 0.15.4-rc.2+gpu@sha256:de67844398b970d5bbddd9ab42f7cded933b49d268ca0b7f8e86861b2e1f2094
cpus: 24
memory: 196608
gpus: 1

models:
  - name: "weights"
    repo: "Qwen/Qwen3.8-27B-FP8@c3a462cc3d38cf351f3b26cbd763469eeb74ef81"
    mpk: "eb71be46ee520ce64401fb88b7d2b34ccb383bdaa8e56a85f9c7c1d31e9b8e14_30890057728_b9f97056-df6a-592f-a2a0-6e8998548668"
    schema: 1

networks:
  egress:
    egress: open

containers:
  - name: "eidola-server-engine"
    image: "ghcr.io/eidola-ai/eidola-server-engine@sha256:116eac9f2c20df313006f9c21a9940bcf5a406c76a99a5c72ea8d0d955b6b13d"
    runtime: nvidia
    models: ["weights"]
    gpus: all
    networks:
      - egress
    secrets:
      - ENGINE_GATEWAY_TOKEN
      - ENGINE_OTEL_EXPORTER_OTLP_ENDPOINT
      - ENGINE_OTEL_EXPORTER_OTLP_HEADERS
    env:
      - EIDOLA_ENV_PREFIX: "ENGINE_"
      - ENGINE_MODEL_ID: "4fc667ee21b46b0f7127370ea42c8766988e62433a7737b7eb434f77b93035e1"
      - ENGINE_WEIGHTS_DIR: "/tinfoil/models/weights"
      - ENGINE_WEIGHTS_SHA256: "4fc667ee21b46b0f7127370ea42c8766988e62433a7737b7eb434f77b93035e1"
      - ENGINE_WEIGHTS_STORAGE: "verified-readonly"
      - ENGINE_EXECUTOR: "cuda"
      - ENGINE_BIND_ADDR: "0.0.0.0:8080"
      - ENGINE_KV_BLOCK_SIZE: "16"
      - ENGINE_KV_DEVICE_BYTES: "123480309760"
      - ENGINE_KERNELS_DIR: "/opt/eidola/kernels"
      - ENGINE_CUDA_GRAPHS: "on"
      - ENGINE_GPU_CC: "required"
      - ENGINE_MAX_MODEL_LEN: "262144"
      - ENGINE_MAX_SEQS: "64"
      - ENGINE_MAX_BATCHED_TOKENS: "2048"
      - ENGINE_MAX_PREFILL_CHUNK: "256"
      - ENGINE_DRAFT_TOKENS: "3"
      - ENGINE_MAX_REQUESTS: "64"
      - ENGINE_PREFIX_CACHE: "true"
      - ENGINE_CACHE_IDLE_TTL_SECS: "900"
      - ENGINE_CACHE_MAX_AGE_SECS: "7200"
      - ENGINE_KV_HOST_BYTES: "68719476736"

shim:
  upstream-port: 8080
  paths:
    - /v1/chat/completions
    - /v1/engine/info
    - /healthz
