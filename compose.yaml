services:
  postgres:
    image: eidola-postgres:dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: oci/postgresql/Containerfile
    environment:
      POSTGRES_USER: eidola
      POSTGRES_DB: eidola
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./crates/eidola-server/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eidola"]
      interval: 5s
      retries: 5

  server:
    image: eidola-server:dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: oci/eidola-server/Containerfile
    environment:
      DATABASE_URL: postgres://eidola@postgres/eidola
      TINFOIL_API_KEY: ${TINFOIL_API_KEY}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      BIND_ADDR: 0.0.0.0:8080
      # Self-hosted inference upstream — set by scripts/dev.sh --inference
      # (empty disables the self-hosted model).
      EIDOLA_INFERENCE_URL: ${EIDOLA_INFERENCE_URL:-}
      EIDOLA_INFERENCE_MODEL: ${EIDOLA_INFERENCE_MODEL:-gemma4-e2b}
      EIDOLA_INFERENCE_MODEL_NAME: ${EIDOLA_INFERENCE_MODEL_NAME:-Gemma 4 E2B}
      EIDOLA_INFERENCE_CONTEXT_LENGTH: ${EIDOLA_INFERENCE_CONTEXT_LENGTH:-8192}
    ports:
      - "8080:8080"
    profiles: ["server"]
    depends_on:
      postgres:
        condition: service_healthy

  inference:
    image: eidola-inference:dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: oci/eidola-inference/Containerfile
    environment:
      # Dev default: the official Google QAT q4_0 GGUF of Gemma 4 E2B —
      # small enough (~3.3 GiB) to fetch once and run on an emulated CPU.
      # Pinned by revision URL + SHA-256; the supervisor refuses to start
      # the engine if the on-disk hash differs. Override via .env to test
      # other models.
      MODEL_URL: ${EIDOLA_INFERENCE_MODEL_URL:-https://huggingface.co/google/gemma-4-E2B-it-qat-q4_0-gguf/resolve/1894d1fc0a19d86697abd40483f5983c867df03f/gemma-4-E2B_q4_0-it.gguf}
      MODEL_SHA256: ${EIDOLA_INFERENCE_MODEL_SHA256:-3646b4c147cd235a44d91df1546d3b7d8e29b547dbe4e1f80856419aa455e6fd}
      # --alias must match the server's EIDOLA_INFERENCE_MODEL so the model
      # id clients select routes to what the engine serves.
      INFERENCE_EXTRA_ARGS: ${EIDOLA_INFERENCE_EXTRA_ARGS:---alias gemma4-e2b -c 8192}
    ports:
      - "8081:8081"
    profiles: ["inference"]
    volumes:
      # Cache verified weights across restarts; the supervisor re-verifies
      # the hash on every boot and re-fetches on mismatch.
      - models:/models

  shim:
    image: tinfoil-shim-mock:dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: oci/tinfoil-shim-mock/Containerfile
    environment:
      # Default targets the in-compose `server` container. Override with
      # `SHIM_UPSTREAM_URL=http://host.docker.internal:8080` to forward to a
      # cargo-built server running on the host (see `just services`).
      UPSTREAM_URL: ${SHIM_UPSTREAM_URL:-http://server:8080}
      LISTEN_ADDR: 0.0.0.0:8443
      CERT_DIR: /src/.dev-certs
    ports:
      - "8443:8443"
    volumes:
      - .dev-certs:/src/.dev-certs
    extra_hosts:
      # Make `host.docker.internal` resolve to the host on Linux too. This is
      # already a no-op on Docker Desktop (mac/Windows) where the alias exists
      # automatically.
      - "host.docker.internal:host-gateway"

  stripe-cli:
    image: stripe-cli:dev
    build:
      context: .
      dockerfile: oci/stripe-cli/Containerfile
    profiles: ["stripe"]
    environment:
      STRIPE_API_KEY: ${STRIPE_API_KEY}
    command:
      [
        "listen",
        "--forward-to",
        "https://shim:8443/v1/webhooks/stripe",
        "--skip-verify",
      ]

volumes:
  pgdata:
  models:
