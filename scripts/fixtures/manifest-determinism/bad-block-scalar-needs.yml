# Fixture — NOT a workflow. Lives outside .github/workflows on purpose.
#
# `needs:` written as a folded block scalar. GitHub reads the dependency as
# `release-assets`; a scanner that takes the text after the colon reads the
# folding marker `>-` and looks for a job by that name.
name: Build & Verify Artifacts (rejected fixture)

on:
  push:
    branches:
      - main

jobs:
  release-assets:
    name: Publish release assets
    runs-on: self-hosted
    environment: apple-signing
    steps:
      - name: Publish
        run: codesign --sign "Developer ID Application" Eidola.app

  artifact-manifest:
    name: Verify artifact manifest
    needs: >-
      release-assets
    runs-on: ubuntu-24.04
    steps:
      - name: Verify full artifact manifest
        run: ./scripts/artifact-manifest.sh verify-full
