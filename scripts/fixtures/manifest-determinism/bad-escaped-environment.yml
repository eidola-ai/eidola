# Fixture — NOT a workflow. Lives outside .github/workflows on purpose.
#
# The environment name spelled with a YAML escape. A double-quoted scalar
# decodes \u002d to `-`, so GitHub reads `apple-signing` while the file
# contains no such string. The same trick works on a job key, where it
# would hide an edge rather than an environment: a name this scanner
# compares in one spelling and GitHub resolves in another.
#
# Escapes are refused rather than decoded. The escape set is closed and
# documented, but decoding it correctly (\x, \u, \U, folded line breaks)
# would be more machinery than this whole scanner — and a scanner that
# decoded it slightly wrong would be asserting something false.
name: Build & Verify Artifacts (rejected fixture)

on:
  push:
    branches:
      - main

jobs:
  release-assets:
    name: Publish release assets
    runs-on: self-hosted
    environment: "apple\u002dsigning"
    steps:
      - name: Build the macOS artifacts
        run: ./scripts/artifact-manifest.sh build-macos

  artifact-manifest:
    name: Verify artifact manifest
    needs:
      - release-assets
    runs-on: ubuntu-24.04
    steps:
      - name: Verify full artifact manifest
        run: ./scripts/artifact-manifest.sh verify-full
