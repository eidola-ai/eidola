# Fixture — NOT a workflow. Lives outside .github/workflows on purpose.
#
# GitHub environment names are case-insensitive: `Apple-Signing` grants the
# same protected environment, with the same secrets, as `apple-signing`.
# A check that compares the name case-sensitively sees an ordinary job.
name: Build & Verify Artifacts (rejected fixture)

on:
  push:
    branches:
      - main

jobs:
  release-assets:
    name: Publish release assets
    runs-on: self-hosted
    environment: Apple-Signing
    steps:
      - name: Publish
        run: codesign --sign "Developer ID Application" Eidola.app

  artifact-manifest:
    name: Verify artifact manifest
    needs:
      - release-assets
    runs-on: ubuntu-24.04
    steps:
      - name: Verify full artifact manifest
        run: ./scripts/artifact-manifest.sh verify-full
