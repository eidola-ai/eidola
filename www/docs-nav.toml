# Structured navigation for the docs section of the website — the sidebar
# on /docs/ pages. Each entry is [path, label]: the path is relative to
# docs/, the label is the short sidebar name (doc h1s are often too long
# for a 200px rail). The build fails if an entry points at a missing file
# or if a docs page is missing from this nav — when adding a doc, add it
# here too.

