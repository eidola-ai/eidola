# Tag-triggered release pipeline.
#
# Two responsibilities, one workflow:
#
# 1. **Tinfoil deployment manifest** (driven by the Tinfoil action).
#    Tinfoil's closed-source deployment system requires this workflow's
#    file to be named `tinfoil-build.yml` — do not rename. The action
#    recomputes enclave measurements from `tinfoil-config.yml` using
#    Python/sevsnpmeasure (independent of our Rust `measure-enclave`),
#    attests the resulting deployment manifest to Sigstore via
#    `actions/attest` (producing a Rekor transparency log entry), and
#    creates the GitHub release with the manifest + its SHA-256 hash.
#    Tinfoil's verifier (`tinfoil-go`) consumes that release.
#
# 2. **Eidola release signing** (the cosign / upload steps below).
#    `cosign sign-blob` signs `artifact-manifest.json` keyless via the
#    workflow's Fulcio OIDC identity (matching the
#    `EXPECTED_CI_IDENTITY_PATTERN` baked into the client trust root).
#    The signed bundle + the manifest itself are uploaded as release
#    assets so clients can verify them during self-update. The release is
#    **not** marked latest here — the engineer's release-tool does that
#    after their human attestation has been signed and uploaded.

name: Tinfoil Build

on:
  push:
    tags:
      - "v*"

# Each tag run is unique and produces a release; serialize rather than cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Attest and release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release for the tag
      id-token: write # mint the OIDC token used for Sigstore attestation
      attestations: write # publish the Sigstore attestation via actions/attest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and release
        uses: tinfoilsh/measure-image-action@ca4cfa35773897455c9e51409d61c75b8e377c27 # v0.10.2
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify measurements match artifact-manifest.json
        run: |
          # Cross-check: the action recomputed measurements from tinfoil-config.yml
          # using Python/sevsnpmeasure. Our artifact-manifest.json was computed by
          # measure-enclave (Rust/sev crate) and verified by CI. They must agree.
          EXPECTED_SNP=$(jq -r '.enclave.snp_measurement' artifact-manifest.json)
          ACTUAL_SNP=$(jq -r '.snp_measurement' output/tinfoil-deployment.json)

          EXPECTED_CMDLINE=$(jq -r '.enclave.cmdline' artifact-manifest.json)
          ACTUAL_CMDLINE=$(jq -r '.cmdline' output/tinfoil-deployment.json)

          EXPECTED_RTMR1=$(jq -r '.enclave.tdx_measurement.rtmr1' artifact-manifest.json)
          ACTUAL_RTMR1=$(jq -r '.tdx_measurement.rtmr1' output/tinfoil-deployment.json)

          EXPECTED_RTMR2=$(jq -r '.enclave.tdx_measurement.rtmr2' artifact-manifest.json)
          ACTUAL_RTMR2=$(jq -r '.tdx_measurement.rtmr2' output/tinfoil-deployment.json)

          FAIL=0
          # A missing path renders as the literal string "null" on BOTH
          # sides, so absent-vs-absent would compare equal and an assertion
          # would silently assert nothing. Every expected value must
          # actually exist — if a field is deliberately retired (e.g. the
          # TDX block), delete its comparison here in the same change.
          for v in "$EXPECTED_SNP" "$EXPECTED_CMDLINE" "$EXPECTED_RTMR1" "$EXPECTED_RTMR2"; do
            if [ -z "$v" ] || [ "$v" = "null" ]; then
              echo "::error::artifact-manifest.json is missing a measurement this cross-check compares"
              FAIL=1
            fi
          done
          if [ "$EXPECTED_SNP" != "$ACTUAL_SNP" ]; then
            echo "::error::SNP measurement mismatch: expected $EXPECTED_SNP, got $ACTUAL_SNP"
            FAIL=1
          fi
          if [ "$EXPECTED_CMDLINE" != "$ACTUAL_CMDLINE" ]; then
            echo "::error::Cmdline mismatch: expected $EXPECTED_CMDLINE, got $ACTUAL_CMDLINE"
            FAIL=1
          fi
          if [ "$EXPECTED_RTMR1" != "$ACTUAL_RTMR1" ]; then
            echo "::error::TDX RTMR1 mismatch: expected $EXPECTED_RTMR1, got $ACTUAL_RTMR1"
            FAIL=1
          fi
          if [ "$EXPECTED_RTMR2" != "$ACTUAL_RTMR2" ]; then
            echo "::error::TDX RTMR2 mismatch: expected $EXPECTED_RTMR2, got $ACTUAL_RTMR2"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Measurement cross-check failed. Our measure-enclave and Tinfoil's action disagree."
            exit 1
          fi

          echo "All measurements match between artifact-manifest.json and tinfoil-deployment.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifact-manifest.json (Fulcio keyless via OIDC)
        run: |
          # Produces a Sigstore bundle binding the workflow's Fulcio OIDC
          # identity to sha256(artifact-manifest.json), with a Rekor
          # inclusion proof embedded. The client trust root pins both the
          # OIDC issuer and the workflow path (EXPECTED_CI_IDENTITY_PATTERN);
          # any cert SAN that doesn't match is rejected on verification.
          cosign sign-blob \
            artifact-manifest.json \
            --bundle artifact-manifest.json.sigstore \
            --yes

          # Sanity: bundle exists and is non-empty.
          test -s artifact-manifest.json.sigstore

      - name: Upload signed manifest to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            artifact-manifest.json \
            artifact-manifest.json.sigstore \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  # ── Attach the measured files themselves ─────────────────────────────────
  # The signed manifest records a hash for every artifact and
  # docs/verification.md promises that hash is checkable with nothing but
  # `sha256sum` — which needs the file published, not just measured. The
  # files are built and measured by `artifacts.yml`, a *different* workflow
  # triggered by the same tag, so they are fetched from that run rather than
  # rebuilt here: whichever job produced the bytes the manifest measured is
  # the job whose bytes must be published, and a rebuild would make that an
  # assumption instead of a fact.
  #
  # Nothing is taken on trust across that seam. `scripts/release-assets.sh`
  # re-hashes every downloaded file against the manifest and decides what
  # may be uploaded; a mismatch, a missing file, or an artifact class no one
  # decided about fails this job before `gh release upload` runs. The
  # release itself already exists at that point (the manifest and its
  # Sigstore bundle are attached above), so a failure here is loud and
  # re-runnable rather than a half-created release — and `--clobber` makes
  # the re-run idempotent.
  publish-assets:
    name: Attach verified release assets
    needs: release
    runs-on: ubuntu-24.04
    # The artifact workflow's Nix builds can take two hours from a cold
    # cache, and on a tag they deliberately build without the project
    # cache. This job spends most of its time waiting for them.
    timeout-minutes: 180
    permissions:
      contents: write # attach assets to the tag's release
      actions: read # read the artifact workflow's run for this tag

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for this tag's artifact workflow run
        id: artifacts-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The tag's own run, not the `main` push run of the same commit:
          # only the tag run skips the project binary cache, so it is the
          # one that built these bytes from source.
          find_run() {
            # No --paginate: with it, --jq runs once per page and a
            # "pick the newest" filter would answer once per page too.
            # Runs for one commit are few; 100 is generous.
            gh api -X GET "repos/$REPO/actions/workflows/artifacts.yml/runs" \
              -f head_sha="$SHA" -f event=push -f per_page=100 \
              --jq "[.workflow_runs[] | select(.head_branch == \"$TAG\")]
                    | sort_by(.run_number) | last
                    | select(. != null) | \"\(.id) \(.status) \(.conclusion)\""
          }

          deadline=$(( $(date +%s) + 170 * 60 ))
          while :; do
            # `|| true`: a transient API failure is one poll lost, not a
            # failed release. The deadline is what ends this loop.
            found="$(find_run || true)"
            if [ -n "$found" ]; then
              # shellcheck disable=SC2086
              set -- $found
              run_id="$1"; status="$2"; conclusion="${3:-}"
              echo "artifacts.yml run $run_id: status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::The artifact workflow for $TAG concluded '$conclusion'. Its outputs are what a release publishes, so nothing is attached. Fix and re-run both."
                  exit 1
                fi
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                break
              fi
            else
              echo "no artifacts.yml run for $TAG yet"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for the artifact workflow run for $TAG. Re-run this job once it finishes."
              exit 1
            fi
            sleep 60
          done

      - name: Download the measured files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.artifacts-run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          # Every `release-assets-*` artifact of that run, flattened into
          # one directory: the names inside are the manifest keys, so a
          # collision between two producers would be a duplicate key, which
          # the manifest cannot have.
          gh run download "$RUN_ID" --repo "$REPO" \
            --pattern 'release-assets-*' --dir /tmp/release-assets-raw
          find /tmp/release-assets-raw -type f -exec mv -n {} /tmp/release-assets/ \;
          ls -l /tmp/release-assets

      - name: Verify every file against the signed manifest
        run: |
          ./scripts/release-assets.sh verify \
            --manifest artifact-manifest.json \
            --dir /tmp/release-assets \
            --list /tmp/release-assets.list

      - name: Attach verified assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < /tmp/release-assets.list
          gh release upload "$TAG" "${assets[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
