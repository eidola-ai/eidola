# Tag-triggered release pipeline.
#
# Two responsibilities, one workflow:
#
# 1. **The server enclave, cross-checked and released.** The server runs on
#    the platform provider's IGVM launch model: `tinfoil-config.yml` pins a
#    cvmimage release manifest inline, that manifest names one SEV-SNP IGVM
#    image, and the server's identity is that image's launch digest plus
#    HOST_DATA, the config's SHA-256. Before anything is released, the
#    enclave block of `artifact-manifest.json` (computed by our Rust
#    `measure-enclave`) is checked against the provider's own measurer,
#    `cvmc measure`, run over the same provenance-verified image, and
#    against the provider's statements of the digest and guest policy. The
#    GitHub release is created with the config and the release manifest it
#    names. Tinfoil's closed-source deployment system requires this
#    workflow's file to be named `tinfoil-build.yml` — do not rename.
#
# 2. **Eidola release signing** (the cosign / upload steps below).
#    `cosign sign-blob` signs `artifact-manifest.json` keyless via the
#    workflow's Fulcio OIDC identity (matching the
#    `EXPECTED_CI_IDENTITY_PATTERN` baked into the client trust root).
#    The signed bundle + the manifest itself are uploaded as release
#    assets so clients can verify them during self-update. The release is
#    **not** marked latest here — the engineer's release-tool does that
#    after their human attestation has been signed and uploaded.

name: Tinfoil Build

on:
  push:
    tags:
      - "v*"

# Each tag run is unique and produces a release; serialize rather than cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Cross-check the enclave and release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release for the tag
      id-token: write # mint the OIDC token cosign signs with

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cross-check the enclave against the platform's own measurer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The release this config launches, and the manifest it pins.
          raw="$(sed -n 's/^cvm-version:[[:space:]]*//p' tinfoil-config.yml)"
          version="${raw%%@sha256:*}"
          pin="${raw#*@sha256:}"
          if [[ "$raw" != *@sha256:* || ! "$pin" =~ ^[0-9a-f]{64}$ || ! "$version" =~ ^[0-9][0-9A-Za-z.-]*$ ]]; then
            echo "::error::tinfoil-config.yml must pin a CPU-image release manifest inline: $raw"
            exit 1
          fi
          cvm_dir="$RUNNER_TEMP/cvm"
          mkdir -p "$cvm_dir"
          base="https://github.com/tinfoilsh/cvmimage/releases/download/v${version}"
          manifest="$cvm_dir/tinfoil-inference-v${version}-manifest.json"
          checksums="$cvm_dir/tinfoil-inference-v${version}-checksums.sha256"
          igvm="$cvm_dir/tinfoil-snp-v${version}.igvm"
          igvm_manifest="$cvm_dir/tinfoil-snp-v${version}.igvm.manifest.json"
          cvmc="$cvm_dir/cvmc-v${version}"
          curl -fsSL --retry 3 -o "$manifest" "$base/$(basename "$manifest")"
          curl -fsSL --retry 3 -o "$checksums" "$base/$(basename "$checksums")"
          for file in "$igvm" "$igvm_manifest" "$cvmc"; do
            curl -fsSL --retry 3 -o "$file" "https://images.tinfoil.sh/cvm/$(basename "$file")"
          done

          # Every file is the provider's: hash-pinned where a pin exists,
          # and built by its release workflow at this release's tag.
          [ "$(sha256sum "$manifest" | cut -d' ' -f1)" = "$pin" ] || {
            echo "::error::the release manifest does not hash to the config's pin"; exit 1; }
          [ "$(sha256sum "$igvm" | cut -d' ' -f1)" = "$(jq -er '.igvm.snp' "$manifest")" ] || {
            echo "::error::the SEV-SNP image is not the one the release manifest records"; exit 1; }
          for file in "$igvm_manifest" "$cvmc"; do
            expected="$(awk -v name="./$(basename "$file")" '$2 == name { print $1 }' "$checksums")"
            [ -n "$expected" ] && [ "$(sha256sum "$file" | cut -d' ' -f1)" = "$expected" ] || {
              echo "::error::$(basename "$file") is not the file the release's checksums record"; exit 1; }
          done
          for file in "$manifest" "$checksums" "$igvm" "$cvmc"; do
            gh attestation verify "$file" -R tinfoilsh/cvmimage \
              --signer-workflow tinfoilsh/cvmimage/.github/workflows/release.yml \
              --source-ref "refs/tags/v${version}" \
              --deny-self-hosted-runners
          done

          # The provider's measurer over the same image: its compiler's
          # own digest code, independent of measure-enclave's.
          chmod +x "$cvmc"
          measured="$("$cvmc" measure "$igvm" | sed -n 's/^expected_snp_measurement: //p')"

          fail=0
          check() {
            local what="$1" expected="$2" actual="$3"
            # An absent field reads as "null" on both sides; every expected
            # value must exist, or the comparison asserts nothing.
            if [ -z "$expected" ] || [ "$expected" = "null" ] || [ "$expected" != "$actual" ]; then
              echo "::error::$what: artifact-manifest.json records '$expected', the platform says '$actual'"
              fail=1
            fi
          }
          enclave() { jq -r ".enclave.$1" artifact-manifest.json; }
          check "launch digest (cvmc measure)" "$(enclave sev_snp.measurement)" "$measured"
          check "launch digest (release manifest)" "$(enclave sev_snp.measurement)" \
            "$(jq -r '.igvm.snp_launch.measurement' "$manifest")"
          check "guest policy (image manifest)" "$(enclave sev_snp.guest_policy)" \
            "$(jq -r '.launch.policy' "$igvm_manifest")"
          check "HOST_DATA (config SHA-256)" "$(enclave sev_snp.host_data)" \
            "$(sha256sum tinfoil-config.yml | cut -d' ' -f1)"
          check "IGVM image" "$(enclave igvm_sha256)" "$(sha256sum "$igvm" | cut -d' ' -f1)"
          check "release" "$(enclave cvm_version)" "$raw"
          # The image is launched without an ID block, which the client
          # refuses: the provider must state none.
          check "ID key digest (image manifest)" "$(printf '0%.0s' $(seq 96))" \
            "$(jq -r '.launch.id_key_digest' "$igvm_manifest")"
          if [ "$fail" -ne 0 ]; then
            echo "::error::The server enclave in artifact-manifest.json does not match the platform's measurement of the image tinfoil-config.yml launches."
            exit 1
          fi
          cp "$manifest" "$RUNNER_TEMP/"
          echo "The server enclave matches the platform's own measurement: $measured"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to re-publish."
            exit 1
          fi
          sha256sum tinfoil-config.yml > "$RUNNER_TEMP/tinfoil-config.sha256"
          printf 'Server enclave: SEV-SNP launch digest `%s`, HOST_DATA `%s` (the SHA-256 of `tinfoil-config.yml`), guest policy `%s`, on cvmimage `%s`.\n' \
            "$(jq -r '.enclave.sev_snp.measurement' artifact-manifest.json)" \
            "$(jq -r '.enclave.sev_snp.host_data' artifact-manifest.json)" \
            "$(jq -r '.enclave.sev_snp.guest_policy' artifact-manifest.json)" \
            "$(jq -r '.enclave.cvm_version' artifact-manifest.json)" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest=false \
            tinfoil-config.yml \
            "$RUNNER_TEMP/tinfoil-config.sha256" \
            "$RUNNER_TEMP"/tinfoil-inference-v*-manifest.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifact-manifest.json (Fulcio keyless via OIDC)
        run: |
          # Produces a Sigstore bundle binding the workflow's Fulcio OIDC
          # identity to sha256(artifact-manifest.json), with a Rekor
          # inclusion proof embedded. The client trust root pins both the
          # OIDC issuer and the workflow path (EXPECTED_CI_IDENTITY_PATTERN);
          # any cert SAN that doesn't match is rejected on verification.
          cosign sign-blob \
            artifact-manifest.json \
            --bundle artifact-manifest.json.sigstore \
            --yes

          # Sanity: bundle exists and is non-empty.
          test -s artifact-manifest.json.sigstore

      - name: Upload signed manifest to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" \
            artifact-manifest.json \
            artifact-manifest.json.sigstore \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  # ── Attach the measured files themselves ─────────────────────────────────
  # The signed manifest records a hash for every artifact and
  # docs/verification.md promises that hash is checkable with nothing but
  # `sha256sum` — which needs the file published, not just measured. The
  # files are built and measured by `artifacts.yml`, a *different* workflow
  # triggered by the same tag, so they are fetched from that run rather than
  # rebuilt here: whichever job produced the bytes the manifest measured is
  # the job whose bytes must be published, and a rebuild would make that an
  # assumption instead of a fact.
  #
  # Nothing is taken on trust across that seam. `scripts/release-assets.sh`
  # re-hashes every downloaded file against the manifest and decides what
  # may be uploaded; a mismatch, a missing file, or an artifact class no one
  # decided about fails this job before `gh release upload` runs. The
  # release itself already exists at that point (the manifest and its
  # Sigstore bundle are attached above), so a failure here is loud and
  # re-runnable rather than a half-created release — and `--clobber` makes
  # the re-run idempotent.
  publish-assets:
    name: Attach verified release assets
    needs: release
    runs-on: ubuntu-24.04
    # This job spends nearly all of its time waiting for `artifacts.yml`,
    # whose Nix builds are slow from a cold cache and, on a tag,
    # deliberately skip the project cache entirely. So this is the *only*
    # clock in the waiting path — the step below polls until that run
    # reaches a conclusion and declares no deadline of its own.
    #
    # The number is not maintained by hand against a workflow in another
    # file: `scripts/release-assets.sh wait-budget` derives the producer's
    # longest declared path from its own `needs` and `timeout-minutes` and
    # fails if this does not exceed it with room for queueing. That check
    # runs on every PR, so bumping a timeout over there fails here at once
    # rather than at release time. GitHub stops a hosted job at 360
    # minutes, which is the ceiling this has to stay under.
    timeout-minutes: 330
    permissions:
      contents: write # attach assets to the tag's release
      actions: read # read the artifact workflow's run for this tag

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for this tag's artifact workflow run
        id: artifacts-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The tag's own run, not the `main` push run of the same commit:
          # only the tag run skips the project binary cache, so it is the
          # one that built these bytes from source.
          find_run() {
            # No --paginate: with it, --jq runs once per page and a
            # "pick the newest" filter would answer once per page too.
            # Runs for one commit are few; 100 is generous.
            gh api -X GET "repos/$REPO/actions/workflows/artifacts.yml/runs" \
              -f head_sha="$SHA" -f event=push -f per_page=100 \
              --jq "[.workflow_runs[] | select(.head_branch == \"$TAG\")]
                    | sort_by(.run_number) | last
                    | select(. != null) | \"\(.id) \(.status) \(.conclusion)\""
          }

          # No deadline here. A run that has not concluded is still a
          # valid run, and the honest end condition is its conclusion, not
          # a clock this step would have to keep in step with another
          # workflow's timeouts. The job's own `timeout-minutes` is the
          # single bound, and `wait-budget` is what keeps it sufficient.
          started=$(date +%s)
          while :; do
            # `|| true`: a transient API failure is one poll lost, not a
            # failed release.
            found="$(find_run || true)"
            if [ -n "$found" ]; then
              # shellcheck disable=SC2086
              set -- $found
              run_id="$1"; status="$2"; conclusion="${3:-}"
              echo "[$(( ($(date +%s) - started) / 60 ))m] artifacts.yml run $run_id: status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::The artifact workflow for $TAG concluded '$conclusion'. Its outputs are what a release publishes, so nothing is attached. Fix and re-run both."
                  exit 1
                fi
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                break
              fi
            else
              echo "[$(( ($(date +%s) - started) / 60 ))m] no artifacts.yml run for $TAG yet"
            fi
            sleep 60
          done

      - name: Download the measured files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.artifacts-run.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          # Every `release-assets-*` artifact of that run, flattened into
          # one directory: the names inside are the manifest keys, so a
          # collision between two producers would be a duplicate key, which
          # the manifest cannot have.
          gh run download "$RUN_ID" --repo "$REPO" \
            --pattern 'release-assets-*' --dir /tmp/release-assets-raw
          find /tmp/release-assets-raw -type f -exec mv -n {} /tmp/release-assets/ \;
          ls -l /tmp/release-assets

      - name: Verify every file against the signed manifest
        run: |
          ./scripts/release-assets.sh verify \
            --manifest artifact-manifest.json \
            --dir /tmp/release-assets \
            --list /tmp/release-assets.list

      - name: Attach verified assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < /tmp/release-assets.list
          gh release upload "$TAG" "${assets[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
