name: Dependency Review

on:
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  dependency-review:
    name: License & vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # `LicenseRef-bad-mitapache-2.0` is the synthetic license the action
          # emits for crates declaring `MIT/Apache-2.0` (deprecated slash form)
          # that its SPDX parser can't parse — e.g. async-tar, rangemap,
          # filetime, ctrlc. The slug is derived from that exact string, so it
          # only ever matches "MIT OR Apache-2.0" crates; since both MIT and
          # Apache-2.0 are already allowed below, allowlisting the ref accepts
          # nothing we wouldn't otherwise. (If a future action bump changes the
          # slug, the check fails closed rather than silently allowing anything.)
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            BSD-1-Clause,
            BSD-2-Clause,
            BSD-3-Clause,
            BSL-1.0,
            bzip2-1.0.6,
            CC0-1.0,
            CDLA-Permissive-2.0,
            ISC,
            LicenseRef-bad-mitapache-2.0,
            MIT,
            MIT-0,
            MPL-2.0,
            NCSA,
            Unicode-3.0,
            Unlicense,
            Zlib
          # Per-package license exemptions. Unlike adding to `allow-licenses`,
          # these don't relax the policy for anything else — third-party Rust
          # crates stay strict — and vulnerability checks still apply.
          # Versionless purls so entries survive SHA/version bumps.
          #
          # GitHub Actions: CI tooling we run but never distribute, so a
          # copyleft license creates no obligation.
          #   * Swatinem/rust-cache — LGPL-3.0. (Pre-existing dep; the workflow
          #     refactor is just the first PR to bring it into review scope.)
          #   * tinfoilsh/measure-image-action — AGPL-3.0.
          #
          # First-party workspace crates: copyleft by our own choice (see
          # LICENSE.md), exempted so a workspace version bump appearing in the
          # Cargo.lock diff doesn't trip the third-party gate.
          allow-dependencies-licenses: >-
            pkg:githubactions/Swatinem/rust-cache,
            pkg:githubactions/tinfoilsh/measure-image-action,
            pkg:cargo/eidola-server,
            pkg:cargo/eidola-app-core,
            pkg:cargo/eidola-cli,
            pkg:cargo/eidola-gui
