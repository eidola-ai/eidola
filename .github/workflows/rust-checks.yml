name: Rust Checks

# Cheap cargo gates (fmt, clippy, test, markdown lint, OpenAPI freshness,
# dependency policy). Split
# out of the `Build & Verify Artifacts` workflow so it runs on PRs to *both*
# `next` and `main` — that expensive chain (oci/apple/artifact-manifest) stays
# scoped to `main`. See
# AGENTS.md "Branch flow".
#
# Path scoping: many PRs into `next` (workflow edits, README/docs, scripts,
# compose, Containerfiles) can't change the outcome of any cargo gate, so the
# `scope` step diffs the PR and skips the heavy steps when nothing relevant
# changed. The *job* always runs and always reports — the expensive *steps* are
# what get gated — so the "Rust checks" required status check never gets stuck
# pending (a path-filtered *workflow* would). The scoping is deliberately
# conservative: a full run is forced on every push and on any PR into `main`
# (so the `next` -> `main` promotion gate is never path-skipped), and any
# changed file we don't recognize as clearly-irrelevant triggers a full run.
on:
  push:
    branches:
      - next
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - next

# Cancel superseded PR runs; let pushes to main and tag releases finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-24.04
    # 60 rather than 30: dev builds compile dependencies at opt-level 2 (see
    # the root Cargo.toml profile block), so a COLD-cache run — a dependency
    # or profile change, or a cache eviction — exceeds 30 minutes on this
    # runner. Warm-cache runs are unaffected. The generous ceiling also
    # protects the post-merge push run that SAVES the cache: rust-cache saves
    # in a post step, which a timeout cancellation skips — a too-tight timeout
    # there would leave every subsequent PR cold, timing out in a spiral.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine which checks to run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Emits three booleans: `rust` (run fmt/clippy/test/openapi), `apple`
        # (run the archive/detacher regressions), and `markdown` (run rumdl).
        # A full run is forced for everything that isn't a PR (push
        # to next/main, tag releases) and for every PR into `main` — the
        # `next` -> `main` promotion must always get the real gate. For a PR
        # into `next`, classify each changed file:
        #   * `*.md` / `.rumdl.toml`  -> markdown lint (rumdl scans the whole
        #     repo, so any markdown anywhere is in scope)
        #   * a curated allowlist of paths that provably can't affect any cargo
        #     gate (other CI configs, docs, scripts, container/compose/build
        #     plumbing, repo metadata) -> ignored
        #   * anything else (all `*.rs`, `Cargo.*`, `rust-toolchain.toml`,
        #     `.cargo/*`, everything under `crates/` and `releases/` — schema
        #     SQL, trust/measurement JSON consumed by the build scripts, test
        #     fixtures, `openapi.json`, etc.) -> full rust run. Unrecognized
        #     files fall through here on purpose, so novelty errs toward running.
        run: |
          set -euo pipefail

          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" = "main" ]; then
            echo "Full run (event=$EVENT base=${BASE_REF:-n/a})."
            {
              echo "rust=true"
              echo "apple=true"
              echo "markdown=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `diff BASE_SHA HEAD` needs only the two trees, not shared history, so
          # a single-commit fetch of the PR base is enough on the shallow
          # checkout. HEAD is the PR's merge commit; BASE_SHA is its base parent.
          #
          # Retried: git 2.54.0 (current runner image) has a shallow-fetch
          # regression (upstream 3ef68ff40e, fixed in 2.55) that intermittently
          # kills a --depth fetch into an already-shallow checkout with
          # "fatal: shallow file has changed since we read it"; a rerun
          # succeeds. Drop the retry loops (here and in the legal-doc step)
          # once runner images ship git >= 2.55.
          for attempt in 1 2 3; do
            git fetch --no-tags --depth=1 origin "$BASE_SHA" && break
            [ "$attempt" -lt 3 ] || exit 1
            echo "git fetch attempt $attempt failed; retrying..." >&2
            sleep 2
          done
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          classification=$(printf '%s\n' "$changed" | .github/scripts/rust-check-scope.sh)
          echo "Resolved scope: $(echo "$classification" | tr '\n' ' ')"
          echo "$classification" >> "$GITHUB_OUTPUT"

      - name: Test check scope classifier
        run: .github/scripts/test-rust-check-scope.sh

      - name: Check legal document versioning
        # The published legal documents (www/pages/terms.md, privacy.md)
        # are accepted by the SHA-256 of their exact bytes, ordered by a
        # front-matter `version` integer — any change to a document's bytes
        # must increment it by exactly one (see the script header). Runs on
        # every PR into either trunk (cheap: git + sed, no toolchain);
        # pushes are exempt because next/main only receive PR-vetted
        # commits (the promotion is a fast-forward of a vetted next head).
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The scope step above has usually fetched BASE_SHA already (every
          # PR into `next`) — skip the redundant fetch then, and retry the one
          # we do run (PRs into `main`) around the git 2.54 shallow-fetch
          # regression described on the scope step's fetch.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2> /dev/null; then
            for attempt in 1 2 3; do
              git fetch --no-tags --depth=1 origin "$BASE_SHA" && break
              [ "$attempt" -lt 3 ] || exit 1
              echo "git fetch attempt $attempt failed; retrying..." >&2
              sleep 2
            done
          fi
          ./scripts/check-legal-doc-versions.sh "$BASE_SHA"

      - name: Free up disk space
        # gpui is a very large dep tree, and the debug + `--all-targets` build
        # (with the `inspector` feature) plus the cargo registry/git and the
        # restored rust-cache overflows the ~20 GB free on the stock ubuntu
        # runner root disk — linking failed with "No space left on device".
        # Reclaim the big preinstalled toolchains this job never uses (~25 GB).
        # Deliberately does NOT touch /opt/hostedtoolcache/node — the
        # node-based actions below (rust-cache) run from it. `rm -rf` ignores
        # any path absent on a given image.
        if: steps.scope.outputs.rust == 'true'
        run: |
          before=$(df --output=avail -BG / | tail -1)
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift
          echo "Root disk avail: $before -> $(df --output=avail -BG / | tail -1)"

      - name: Install Linux GUI build dependencies
        # The eidola-gui crate builds gpui's Wayland backend on Linux (the
        # `wayland` feature in its Cargo.toml), which links fontconfig,
        # freetype, libxkbcommon, wayland, and the Vulkan loader via
        # pkg-config — the same set `nix develop .#gui` / `guiLinuxLibs`
        # supplies locally. Without them the cargo gates fail in the
        # fontconfig-sys build script. `libxkbcommon-x11-dev` is required at
        # link time even for the Wayland-only build (upstream gpui_linux
        # hardcodes the xkbcommon `x11` crate feature — see the GUI AGENTS.md).
        # Gated on the rust scope: only the cargo gates compile the workspace
        # (the markdown step builds just rumdl, which needs none of these).
        if: steps.scope.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            cmake \
            libfontconfig-dev \
            libfreetype-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        # Needed for the cargo gates and for building rumdl; skip only when
        # none of these scopes is active (e.g. an unrelated scripts-only PR).
        if: steps.scope.outputs.rust == 'true' || steps.scope.outputs.apple == 'true' || steps.scope.outputs.markdown == 'true'
        run: rustup show

      - name: Cache cargo registry and build artifacts # zizmor: ignore[cache-poisoning]
        # Save from pushes to both trunks: `next` (the active integration
        # branch — this is what warms feature PRs, which restore from their
        # base) and `main` (the default branch — the universal restore fallback
        # and the promotion PR's base). PRs never save (github.ref is a PR ref),
        # so there's no per-PR thrash. This job only runs tests; no artifact
        # from here is published.
        if: steps.scope.outputs.rust == 'true' || steps.scope.outputs.apple == 'true' || steps.scope.outputs.markdown == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' }}

      - name: Check formatting
        if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --check

      - name: Clippy
        if: steps.scope.outputs.rust == 'true'
        run: |
          echo "::add-matcher::.github/rust-problem-matcher.json"
          cargo clippy --all-targets -- -D warnings
          echo "::remove-matcher owner=rust::"

      - name: Markdown lint
        if: steps.scope.outputs.markdown == 'true'
        # rumdl is pinned by the crates/devtools anchor crate and, locally,
        # is on PATH via direnv (.envrc). CI deliberately doesn't install
        # direnv (no apt in the build chain); instead it emulates .envrc —
        # build the one tool it needs and prepend target/debug to PATH — so
        # the `rumdl` invocation matches the local one without compiling the
        # rest of the pinned toolset (e.g. just).
        run: |
          cargo build --quiet -p rumdl
          export PATH="$PWD/target/debug:$PATH"
          rumdl check .

      - name: Run tests
        if: steps.scope.outputs.rust == 'true'
        run: cargo test

      # The committed Apple fixtures are the crate's golden, so an
      # Apple-only change (fixture tree, harness, instruments) must still run
      # the placement regressions. A full `cargo test` above already covers
      # them when the Rust scope is selected.
      - name: Run Apple placement regressions
        if: steps.scope.outputs.rust != 'true' && steps.scope.outputs.apple == 'true'
        run: cargo test -p eidola-apple

      - name: Test Apple archive verifier (tar + zip, read-only directories)
        if: steps.scope.outputs.rust == 'true' || steps.scope.outputs.apple == 'true'
        # The harness runs its body under the host userland and again under GNU
        # tar + mawk, because bsdtar and BSD awk on a developer's Mac hide
        # differences that bite on the GNU/Linux userland most people verifying
        # a download run. This runner is that userland, so the second pass needs
        # no Nix here — but it may only ever be skipped on a developer machine,
        # never in CI, which is what this variable enforces.
        env:
          EIDOLA_TEST_REQUIRE_GNU_USERLAND: "1"
        run: ./scripts/test-verify-apple.sh

      - name: Check OpenAPI spec freshness
        if: steps.scope.outputs.rust == 'true'
        run: |
          cargo run -q -p generate-openapi > /tmp/openapi-generated.json
          if ! diff /tmp/openapi-generated.json crates/eidola-server/openapi.json; then
            echo ""
            echo "ERROR: Committed OpenAPI spec doesn't match generated one!"
            echo "Run: just update-openapi"
            exit 1
          fi

      - name: Check dependency policy (cargo-deny)
        # Validates the entire resolved graph against deny.toml — licenses,
        # bans, and sources. This complements dependency-review.yml, which
        # only inspects each PR's Cargo.lock *diff* and so never re-checks the
        # standing graph; the two share one license policy (see the alignment
        # note in deny.toml). `advisories` is deliberately excluded here:
        # advisories publish on their own clock, so gating PRs on them fails
        # work that didn't introduce anything — the scheduled advisories
        # workflow covers those. cargo-deny is pinned by the crates/devtools
        # anchor and built from the lockfile, same as rumdl above.
        if: steps.scope.outputs.rust == 'true'
        run: |
          cargo build --quiet -p cargo-deny
          ./target/debug/cargo-deny check licenses bans sources
