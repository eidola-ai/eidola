name: Dependency Advisories

# `cargo deny check advisories` audits the lockfile against the RustSec
# advisory database. It is deliberately NOT part of the rust-checks PR gate:
# advisories publish on their own clock, so a PR gate that included them would
# fail work that didn't introduce anything. Instead this runs daily against
# the default branch (plus on demand), and a new advisory shows up as a red
# scheduled run rather than as a block on unrelated PRs. The PR-time policy
# checks (licenses, bans, sources) live in rust-checks.yml.
on:
  schedule:
    # Daily; minute/hour chosen off the whole-hour spikes GitHub asks
    # schedules to avoid.
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  advisories:
    name: Advisory audit
    runs-on: ubuntu-24.04
    # Generous for a COLD-cache run: cargo-deny's dep tree builds at
    # opt-level 2 (crates/devtools dev profile). Warm runs are minutes.
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        # Job-scoped key (no shared-key), so this cache holds only the
        # cargo-deny build — a sliver next to the rust-checks cache — and the
        # daily run keeps it warm. Schedule and dispatch both run on the
        # default branch, so saving here never thrashes per-PR.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/devtools -> target

      - name: Audit advisories
        # cargo-deny is pinned by the crates/devtools workspace and built
        # from its lockfile — the same binary the rust-checks gate and local
        # `just check` use. Both lockfiles are audited: the product's and
        # the tools' own; either failing fails the run.
        run: |
          cargo build --quiet --manifest-path crates/devtools/Cargo.toml -p cargo-deny
          status=0
          ./crates/devtools/target/debug/cargo-deny check advisories || status=1
          ./crates/devtools/target/debug/cargo-deny --manifest-path crates/devtools/Cargo.toml check advisories || status=1
          exit "$status"
