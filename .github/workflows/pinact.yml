name: Suggest pinning GitHub Actions

on:
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"

# Cancel superseded runs when a PR branch is updated; only the latest commit's
# pin suggestions are useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level: no permissions by default; each job opts in to what it needs.
permissions: {}

jobs:
  suggest-pins:
    name: Suggest pinning GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # reviewdog posts pin suggestions as PR review comments
      contents: read # pinact reads workflow files and resolves action refs via the GitHub API
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # reviewdog (inside pinact-action) computes the PR diff to place its
          # review comments. A shallow clone lacks the base commit, so it falls
          # back to `git fetch`, which races on the shallow file
          # ("fatal: shallow file has changed since we read it") and fails the
          # job even when pinact finds nothing. Full history lets reviewdog diff
          # locally without fetching.
          fetch-depth: 0

      - name: Suggest action pins
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false" # validate-only; implies skip_push:"true" (no files modified, nothing to commit)
          review: "true" # surface unpinned actions as reviewdog PR review comments
