# Sign a release's `artifact-manifest.json`, and nothing else.
#
# `cosign sign-blob` signs the manifest keyless under this workflow's Fulcio
# OIDC identity, the one clients pin (`expected_ci_identity_pattern` in
# `releases/trust/trust-constants.json`). Fulcio derives that identity from
# the workflow *file*, so it lives in a file of its own: nothing the release
# workflow runs (the provider's measurer, release creation, asset
# publishing) can mint it, and within this file only the `sign` job holds
# `id-token: write`, running a checkout and cosign.
#
# Triggered by the tag directly, never `workflow_call`. Any public
# repository may call a reusable workflow, and Fulcio's SAN names the called
# file, so a caller elsewhere could mint a certificate matching the pin over
# a manifest of its own.
#
# The order of a release:
#
# 1. `release-created` waits for `tinfoil-build.yml` to create the tag's
#    release, which it does only once the enclave the manifest records has
#    been cross-checked against the platform's own measurer. Nothing is
#    signed before that.
# 2. `signing-identity` refuses a signature the previous release's clients
#    would reject (`scripts/check-signing-identity.sh`).
# 3. `sign` signs.
# 4. `attach-signature` uploads the manifest and its bundle to the release,
#    with no OIDC token. The release is **not** marked latest here — the
#    engineer's release-tool does that after their human attestation has
#    been signed and uploaded.

name: Sign Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-created:
    name: Wait for the cross-checked release
    runs-on: ubuntu-24.04
    # `tinfoil-build.yml`'s cross-check and release jobs are ten minutes
    # each; the rest is room for queueing.
    timeout-minutes: 40
    permissions:
      contents: read # read the tag's release

    steps:
      - name: Wait for the tag's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          started=$(date +%s)
          until gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
            echo "[$(( ($(date +%s) - started) / 60 ))m] no release for $TAG yet"
            sleep 20
          done
          echo "The release for $TAG exists."

  signing-identity:
    name: Check the previous release's clients accept this signer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the tree and every release tag

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # every release tag, to read the previous release's pin

      - name: Check this workflow against the previous release's pin
        env:
          TAG: ${{ github.ref_name }}
        # The identity the `sign` job's token will carry: Fulcio's SAN for a
        # top-level workflow is its own ref.
        run: ./scripts/check-signing-identity.sh "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" "$TAG"

  sign:
    name: Sign artifact-manifest.json
    needs: [release-created, signing-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the tagged tree
      id-token: write # mint the OIDC token cosign signs with
    outputs:
      bundle: ${{ steps.sign.outputs.bundle }}

    # Every step here can mint the pinned identity. Keep it to these.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign artifact-manifest.json (Fulcio keyless via OIDC)
        id: sign
        run: |
          set -euo pipefail
          # Produces a Sigstore bundle binding the workflow's Fulcio OIDC
          # identity to sha256(artifact-manifest.json), with a Rekor
          # inclusion proof embedded. Clients pin both the OIDC issuer and
          # the workflow path; any cert SAN that doesn't match is rejected
          # on verification.
          cosign sign-blob \
            artifact-manifest.json \
            --bundle "$RUNNER_TEMP/artifact-manifest.json.sigstore" \
            --yes
          test -s "$RUNNER_TEMP/artifact-manifest.json.sigstore"
          # Handed to `attach-signature` as an output, so attaching needs no
          # artifact store and this job runs no action past cosign.
          echo "bundle=$(base64 -w0 "$RUNNER_TEMP/artifact-manifest.json.sigstore")" >> "$GITHUB_OUTPUT"

  attach-signature:
    name: Attach the signed manifest to the release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # attach assets to the tag's release

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload the signed manifest to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ needs.sign.outputs.bundle }}
        run: |
          set -euo pipefail
          printf '%s' "$BUNDLE" | base64 -d > artifact-manifest.json.sigstore
          test -s artifact-manifest.json.sigstore
          gh release upload "$TAG" \
            artifact-manifest.json \
            artifact-manifest.json.sigstore \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
