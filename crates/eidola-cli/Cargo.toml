[package]
name = "eidola-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "eidola"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
eidola-app-core = { path = "../eidola-app-core" }
open = "5"
tokio = { version = "1", features = ["sync", "macros", "time", "signal"] }

# `faccessat(X_OK, AT_EACCESS)` — "can the installing user execute this?", the
# question a mode-bit mask cannot answer. Already in the workspace graph.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
# `service::install` writes into an XDG config home; the unit tests point it
# at a temp dir rather than the developer's real ~/.config.
tempfile = "3"
