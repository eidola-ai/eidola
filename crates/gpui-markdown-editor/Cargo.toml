[package]
name = "gpui-markdown-editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "gpui_markdown_editor"
path = "src/lib.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[dependencies]
# Mirror the eidola-gui pin so cargo unifies on a single gpui copy across the
# workspace.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/eidola-ai/gpui-component", branch = "eidola" }
gpui-component-assets = { git = "https://github.com/eidola-ai/gpui-component", branch = "eidola" }

# Our fork's `eidola` branch (upstream main + our feature commits, rebased):
# exposes `Options::ENABLE_EMPTY_NESTED_LISTS` — we need pulldown to parse
# `  - \n` (and similar empty-nested-item shapes) as a list item rather than
# lazy-continuation text so the editor's chain query stays correct mid-typing
# — plus block display math. Switch back to crates.io once the upstream PRs
# land. `std` is required (the fork's default disables it via
# `default-features = false`); we don't need `html` or `getopts`.
pulldown-cmark = { git = "https://github.com/eidola-ai/pulldown-cmark", branch = "eidola", default-features = false, features = ["std"] }
# RaTeX — parse + lay out LaTeX math expressions into a DisplayList of
# absolute-coordinate drawing commands. We walk the DisplayList and
# emit native gpui paint ops (paint_quad / paint_path / shaped text)
# rather than going through a raster intermediate, so math composes
# with the editor's text and respects Day/Night themes.
ratex-types = "0.1.13"
ratex-parser = "0.1.13"
ratex-layout = "0.1.13"
ratex-font = "0.1.13"
ratex-katex-fonts = "0.1.13"
smallvec = "1.15"
unicode-segmentation = "1"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["test-support", "font-kit"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[test]]
name = "visual"
path = "tests/visual.rs"
# `VisualTestAppContext` talks to AppKit and must run on the main thread.
# `harness = false` lets us run a hand-rolled `fn main()` directly.
harness = false
