[package]
name = "tinfoil-verifier"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
# SEV-SNP attestation report parsing and certificate chain verification
sev = { version = "8", default-features = false, features = ["snp", "crypto_nossl"] }

# Intel TDX quote verification (pure Rust, RustCrypto backend): PCK chain to
# the pinned Intel SGX root with CRL checks, TCB Info / QE Identity
# signatures, QE report and quote signatures, platform/QE/TDX-module TCB
# matching. Only offline verification is used — collateral comes from the
# attestation document. `std` is deliberately off: it turns on
# `serde_json/preserve_order`, which would change `serde_json::Value` key
# order for every crate linked into the same binary. Without `report` there
# is no PCS fetcher and no `ring`.
dcap-qvl = { version = "=0.7.1", default-features = false, features = ["rustcrypto", "default-x509"] }

# DER encoding (for SPKI fingerprint extraction; transitive dep of sev, pinned for direct use)
x509-cert = "0.2"
der = { version = "0.7", features = ["alloc"] }
# RSA-PSS verification for AMD CRLs (the `sev` crate uses this same crate
# internally for ARK→ASK signature verification when built with the
# `crypto_nossl` feature; we pin it directly so we can verify CRLs the
# `sev` crate doesn't handle).
rsa = "0.9"

# CSPRNG for the per-handshake attestation nonce.
getrandom = "0.4"

# TLS verification. Trust roots are supplied by the caller via
# `AttestingClientConfig::tls_roots` — the verifier intentionally does not
# bundle `webpki-roots` or `rustls-native-certs` so each consumer (gateway in
# enclave, CLI on developer machine, etc.) can pick the source that fits its
# environment without dragging the wrong dep into the others.
rustls = { version = "0.23", default-features = false, features = ["std"] }

# Hashing. Pinned to 0.10 because the rsa crate's `VerifyingKey<D>`
# bounds require `D: rsa::sha2::Digest`, which only resolves when our
# `Sha384` comes from the same `sha2` version rsa was compiled against.
sha2 = { version = "0.10", features = ["oid"] }

# Encoding
base64 = "0.23"
hex = "0.4"
pem = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
# `raw_value` keeps Intel-signed JSON members as the exact bytes served.
serde_json = { version = "1", features = ["raw_value"] }

# Error handling
thiserror = "2"

# `platform_endorsements` (feature `platform-endorsements`): offline
# verification of the platform provider's Sigstore-signed platform
# endorsements — Fulcio chain and identity, DSSE signature, Rekor SET and
# inclusion proof — for the pin-authoring tools (`measure-enclave`, the
# gateway's build). The same crates and versions the updater verifies our own
# releases with; none is linked into a build without the feature.
const-oid = { version = "0.9", features = ["db"], optional = true }
spki = { version = "0.7", optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"], optional = true }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"], optional = true }
signature = { version = "2", optional = true }
# The platform release tag grammar (`eidola_common::platform_release`), the
# one parser a sidecar's tag, a vendored release's directory and the tag an
# attestation must be signed at are all read with. Only with
# `platform-endorsements`; that feature's users (`measure-enclave`, the
# gateway's build and tests) depend on `eidola-common` themselves.
eidola-common = { path = "../eidola-common", optional = true }

# Logging
tracing = "0.1"

# The attestation check's inline request runs over any tokio byte stream
# (`attest`), and the byte-pipe transport (`pipe`) runs TLS over one a host
# dialed. Neither needs a runtime: `io-util` alone, on every target.
tokio = { version = "1", default-features = false, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
# Parses the attestation response's head.
httparse = "1"
# Classifies a TDX document's captured Intel PCS responses by URL: the parser
# `reqwest::Url` re-exports, depended on directly so wasm32 links no reqwest.
url = "2"

# The reqwest connector is native-only (`attesting_client`): it drives TCP
# and TLS through tokio and reqwest's native connector. The check and the
# byte-pipe transport compile for wasm32 without it.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# HTTP client returned to callers.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Connector layer plumbing for the per-handshake attesting client.
# `tower` gives us Layer/Service traits; `hyper` and `hyper-util` give us the
# Read/Write/Connection traits and the TokioIo adapter that turns a
# freshly handshaked connection into the stream the check drives.
tower = { version = "0.5", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http = "1"

# Async runtime; `net` for the native `pipe::TcpDialer`.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "time"] }

# wasm32-unknown-unknown has no OS randomness or clock: the nonce (getrandom
# 0.4) and the RSA crates (getrandom 0.2) draw from the browser's, and rustls
# reads the browser's clock (`rustls-pki-types/web`).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
rustls-pki-types = { version = "1", features = ["web"] }

[features]
platform-endorsements = ["dep:eidola-common", "dep:const-oid", "dep:spki", "dep:p256", "dep:p384", "dep:signature"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
# The byte-pipe tests run against in-process shims (`tests/pipe.rs`).
tinfoil-shim-mock = { path = "../tinfoil-shim-mock" }
# The live and mock-shim tests install the RustCrypto provider, as production
# callers do.
rustls-rustcrypto = "0.1.0-pre.0"
# Live integration tests pull in WebPKI roots so they can talk to a live
# Tinfoil enclave. Production callers (eidola-server-gateway) bring their own.
webpki-roots = "1"
