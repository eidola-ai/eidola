[package]
name = "measure-enclave"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[[bin]]
name = "measure-enclave"
path = "src/main.rs"

[[bin]]
name = "measure-tdx-igvm"
path = "src/bin/measure-tdx-igvm.rs"

[[bin]]
name = "measure-engine-enclaves"
path = "src/bin/measure-engine-enclaves.rs"

[[bin]]
name = "vendor-platform-endorsements"
path = "src/bin/vendor-platform-endorsements.rs"

[dependencies]
# IGVM image parsing: the SEV-SNP launch digest and the TDX MRTD of
# IGVM-model releases
igvm = "0.5"
igvm_defs = "0.5"
# The VMSA page bytes of an IGVM SEV-SNP VP context.
zerocopy = "0.8"

# The engine-deployment config grammar shared with the gateway and the node
# (`cvm-version`, cache retention).
eidola-common = { path = "../eidola-common", features = ["deployment"] }

# The attesting client's pin types and its pin compiler: every pin emitted is
# one the client (and the gateway's build) accepts. `platform-endorsements`
# verifies the provider's signed platform endorsements offline and derives
# the TDX machine policy from them.
tinfoil-verifier = { path = "../tinfoil-verifier", features = ["platform-endorsements"] }

# Config parsing; `raw_value` keeps a downloaded Sigstore bundle as the bytes
# served.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"

# Hashing (SHA-256 for config hash)
sha2 = "0.11"

# Encoding
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

[dev-dependencies]
# Tampering with a vendored Sigstore bundle's base64 members.
base64 = "0.23"
