[project]
name = "eidola-engine-model-golden-qwen38"
version = "0.0.0"
description = "Dev-only generator of golden reference outputs for the Qwen3.8 reference forward (never a build input)."
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.3.4",
    "torch==2.13.0",
    "transformers==5.23.0",
]

[tool.uv]
package = false

# The generator runs torch on CPU only: PyTorch's CPU-only index carries no
# CUDA runtime, so no `nvidia-*` or `triton` package enters the lock.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
