[project]
name = "eidola-engine-model-golden-deepseek-v41"
version = "0.0.0"
description = "Dev-only generator of golden reference outputs for the DeepSeek-V4.1 reference forward (never a build input)."
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.3.4",
    "sympy==1.14.0",
    "tokenizers==0.22.1",
    "torch==2.10.0",
]

[tool.uv]
package = false

# The generator runs torch on CPU only: PyTorch's CPU-only index carries no
# CUDA runtime, so no `nvidia-*` or `triton` package enters the lock.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
