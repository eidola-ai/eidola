[package]
name = "eidola-app-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license = "GPL-3.0-only"

[features]
# Test-only seams (`AppCore::with_test_http_client`, the `test_*` observer
# methods): compiled only when this feature is on. It is NOT a default
# feature and must never appear in a downstream `[dependencies]` entry — the
# self-referential `[dev-dependencies]` below enables it for this crate's own
# unit + integration tests, so `cargo test` sees the seams while release
# builds of the cli/GUI provably contain no attestation-bypass path.
test-support = []
# The desktop-only subsystems: the IPC control socket, the local inference
# proxy, the local llama.cpp engines, and the updater's desktop install kinds
# and installer. On by default, so the CLI and GUI build exactly as they did;
# the wasm32 build for the mobile app turns it off. Platform facilities (the
# multi-threaded runtime, the filesystem lock, the OS trust store) are gated
# by target instead, so a native build without this feature keeps them.
default = ["desktop"]
desktop = ["dep:eidola-apple", "hyper/server", "dep:http-body-util", "dep:zip"]

[dependencies]
anonymous-credit-tokens = "0.4"
base64 = "0.23"
blake3 = "1"
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["pem", "alloc"] }
dirs = "7"
ecdsa = { version = "0.16", features = ["der", "verifying"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
eidola-attestation = { path = "../eidola-attestation" }
eidola-common = { path = "../eidola-common", features = ["spend-credentials"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
# HTTP over a host-dialed stream (`transport::pipe`, hyper's client
# connection), and the local inference proxy's HTTP surface
# (`src/proxy/http.rs`, `desktop` adds hyper's server). Every one of these is
# **already in this crate's native dependency graph** through `reqwest` —
# which is why hyper is preferred for the proxy over axum, whose routing and
# extractors this three-route surface has no use for.
bytes = "1"
http = "1"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# The URL parser `reqwest::Url` re-exports: the host-socket transport parses
# a request's URL as the native client does.
url = "2"
# Decodes a URL's userinfo into credentials, as reqwest does (`transport`).
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.1.0-pre.0"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The installer's detached-signature reconstruction (`updater::install`).
eidola-apple = { path = "../eidola-apple", optional = true }
sha2 = "0.11"
signature = "2"
spki = { version = "0.7", features = ["pem"] }
thiserror = "2"
tinfoil-verifier = { path = "../tinfoil-verifier" }
tokio = { version = "1", features = ["sync", "rt", "io-util", "time", "macros"] }
toml = "1"
turso = { git = "https://github.com/eidola-ai/turso", branch = "fix-concurrent-view-expansion-guard", default-features = false, features = ["pure-rust-crypto"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
x509-cert = "0.2"
# Scrubs the prefix-cache key (`prefix_cache`) wherever this crate holds it.
# Already in this crate's graph through the credential and TLS crates.
zeroize = "1"
# The installer's container reader (`updater::install`).
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

# What a browser does not have: the multi-threaded runtime, subprocesses and
# tokio's filesystem, the OS trust store, and flock.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Advisory (flock) file locking for the local-database lockfile. Pure Rust
# (rustix), sync backend only — no async runtime pulled in.
fs4 = { version = "1", default-features = false, features = ["sync"] }
# The native transport (`transport`). wasm32 links no reqwest, so nothing
# there can fall back to the browser's `fetch`.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs"] }

# What wasm32 needs in their place: randomness and the clock from the browser
# (wasm32-unknown-unknown has no OS for either), and its event loop for the
# runtime seam (`src/rt.rs`). getrandom 0.3 also needs the `getrandom_backend`
# cfg that `.cargo/config.toml` sets for this target.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
rustls-pki-types = { version = "1", features = ["web"] }
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "0.2"
# The TLS roots a host-dialed connection is checked against: wasm32 has no OS
# trust store (`transport::HostNetwork` adds a developer's own).
webpki-roots = "1"
wasm-bindgen-futures = "0.4"
web-time = "1"

[build-dependencies]
# The model catalog's reader (`models/`), the one the gateway's build runs, so
# the catalog compiled into the client is the one the gateway serves.
eidola-common = { path = "../eidola-common", features = ["catalog"] }
eidola-attestation = { path = "../eidola-attestation" }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
# Self-reference: turns the `test-support` feature on for this crate's own
# test builds (unit + `tests/`) without exposing it to downstream consumers.
# `default-features = false`, so this reference cannot switch `desktop` back
# on for a test build that turned it off; the default build gets it from the
# package's own defaults.
eidola-app-core = { path = ".", default-features = false, features = ["test-support"] }
# Strict chat-request acceptance bridge for the real HTTP harness captures.
# Test-only: app-core's production dependency graph must not include server.
eidola-server-gateway = { path = "../eidola-server-gateway", features = ["test-support"] }
libc = "0.2"
tempfile = "3"
# The host-socket transport's end-to-end suite attests against in-process
# shims (`tests/pipe_transport.rs`).
tinfoil-shim-mock = { path = "../tinfoil-shim-mock" }
# Building the containers the install fixtures download. Same crate and
# features the installer unpacks with, so a test never proves a shape the
# shipping reader would refuse.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
wiremock = "0.6"
anonymous-credit-tokens = "0.4"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.1.0-pre.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Suites of the desktop-only subsystems: a build without `desktop` skips them.
# Each names its path, so the image builds' stub workspace (manifests without
# sources) still resolves.
[[test]]
name = "ipc_protocol"
path = "tests/ipc_protocol.rs"
required-features = ["desktop"]

[[test]]
name = "local_models"
path = "tests/local_models.rs"
required-features = ["desktop"]

[[test]]
name = "proxy"
path = "tests/proxy.rs"
required-features = ["desktop"]

[[test]]
name = "updater_install_modes"
path = "tests/updater_install_modes.rs"
required-features = ["desktop"]

[[test]]
name = "updater_install_stage"
path = "tests/updater_install_stage.rs"
required-features = ["desktop"]
