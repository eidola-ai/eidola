[package]
name = "eidola-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
# Contract fidelity, not convenience: the pricing contract's *walk* (which
# parts of a chat-completion request count, and how each is measured) must be
# one implementation, or the client and server drift. Both consumers already
# carry serde_json 1 — this adds no code, trust, or compile time to any
# binary. Declared featureless on purpose: see `json_text_bytes` on why
# `preserve_order` cannot skew the measure, and the crate docs for the rule
# that governs any future dependency here.
serde_json = { version = "1", default-features = false, features = ["std"] }
# The Argon2id rule of `engine_deployment` (`parse_gateway_token_hash`). Optional,
# so it enters only the graphs of the two consumers that enable it — the node
# and the gateway — and both already depend on `argon2 0.6` themselves.
argon2 = { version = "0.6", optional = true }

# `engine_deployment::deployment`: one engine deployment's config and sidecar,
# checked whole. Optional, enabled only by the gateway's build and tests and by
# `measure-enclave`, each of which already reads YAML deployment configs.
serde_yaml = { version = "0.9", optional = true }

[features]
argon2 = ["dep:argon2"]
deployment = ["argon2", "dep:serde_yaml"]
