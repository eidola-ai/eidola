[package]
name = "eidola-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license = "GPL-3.0-only"

[[bin]]
name = "eidola-gui"
path = "src/main.rs"

[dependencies]
# gpui-component pulls gpui/gpui_platform from zed-industries/zed without a rev,
# so we mirror that spec exactly to avoid resolving two copies of gpui.
# Cargo.lock is the canonical pin for the resolved zed commit.
#
# `inspector` enables the in-app element inspector (Window::toggle_inspector +
# the rich gpui-component renderer). Also auto-enabled in debug builds via
# `debug_assertions`; the explicit feature ensures it works in release builds.
# `runtime_shaders` (passed through to `gpui_macos/runtime_shaders` via
# gpui_platform) embeds the raw Metal Shading Language source in the binary and
# compiles it through MTLDevice at app startup instead of invoking Apple's
# closed-source `metal` compiler at build time. Two reasons we want it:
# (1) the Nix sandbox has no access to Xcode tooling, so without this the
# release build fails with `tool 'metal' not found` and the rest of the
# gpui-component dep tree fails type-inference transitively from
# gpui_macos's aborted build script; (2) the precompiled `.metallib`
# otherwise depends on the local Xcode/metal version, defeating
# reproducibility across developers and CI. Startup cost is a one-time
# MTLDevice library compile (~50ms). Zed's own Nix package makes the same
# trade-off.
gpui = { git = "https://github.com/zed-industries/zed", features = ["inspector"] }
# `wayland` selects gpui's Linux windowing backend. It's gated inside
# gpui_platform by `cfg(target_os = ...)`, so enabling it universally is a
# no-op on macOS/Windows — no `[target.'cfg(...)']` split needed. Linux is
# Wayland-only by decision (see AGENTS.md — cleaner all-open-source story,
# narrower deployment surface); do not add the `x11` feature back.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders", "wayland"] }
gpui-component = { git = "https://github.com/eidola-ai/gpui-component", branch = "eidola", features = ["inspector"] }
gpui-component-assets = { git = "https://github.com/eidola-ai/gpui-component", branch = "eidola" }

eidola-app-core = { path = "../eidola-app-core" }
gpui-markdown-editor = { path = "../gpui-markdown-editor" }
# Localization (see `src/i18n.rs`). `fluent-bundle` formats the messages;
# `unic-langid` supplies the locale identifiers a bundle is built with;
# `sys-locale` reads the OS's preferred-language list for negotiation. All
# three are pure Rust (sys-locale reaches CoreFoundation/`libc` through plain
# extern declarations, no C to compile), which is what the cross-compilation
# convention requires. The FTL itself is embedded at build time — nothing here
# ever reads a translation from disk.
fluent-bundle = "0.16"
sys-locale = "0.3"
unic-langid = "0.9"
# Only for `localtime_r` (the circadian clock's local hour) — already in the
# tree via gpui; the workspace avoids a chrono dependency.
libc = "0.2"
serde_json = "1"
# `signal` backs the windowless mode's SIGTERM/SIGINT → `cx.quit()` bridge
# (`lifecycle::install_signal_quit`); `time` its bounded engine teardown.
tokio = { version = "1", features = ["sync", "signal", "time"] }

# The status item, the Regular ⇄ Accessory activation flip, and the login
# item (task 17 wave 3) are AppKit/ServiceManagement, not gpui — a status menu
# is not a window, so this needs no gpui fork. `objc2` is the modern, typed
# binding layer; gpui's own platform crate still uses the older `cocoa`/`objc`
# pair, and the two coexist (both are just the Objective-C runtime). Versions
# mirror what gpui's dependency tree already resolves, so cargo unifies.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }

[build-dependencies]
# `build.rs` parses every locale's FTL and generates the typed accessors from
# the English source (see `build_support/codegen.rs`). `unic-langid` is the same
# parser the runtime builds bundles with, used here to refuse a locale directory
# whose name is not a canonical language tag.
fluent-syntax = "0.12"
unic-langid = "0.9"

[dev-dependencies]
# The same parser the build script uses: `tests/i18n.rs` includes
# `build_support/codegen.rs` directly, so the build-error contract is asserted
# by tests rather than by committing deliberately-broken FTL.
fluent-syntax = "0.12"
# Pulls in `VisualTestAppContext` and `Window::render_to_image`. Cargo unifies
# this with the regular `gpui` dep, so feature flags merge for dev/test builds
# — and for examples, which is how `examples/driver.rs` reaches the visual
# test context outside `cargo test`.
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
# The driver example's JSON-lines protocol.
serde = { version = "1", features = ["derive"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["test-support", "font-kit", "wayland"] }
# The embed-marker recognition lockstep test (tests/embed_lockstep.rs): this
# crate is the one place that sees both the editor's parser-driven embed
# recognition and eidola-common's structural scanner, so the corpus test
# proving they agree lives here.
eidola-common = { path = "../eidola-common" }
image = { version = "0.25", default-features = false, features = ["png"] }
# Store-level tests (tests/stores.rs) build a real `AppCore` over tempdirs and
# install the crypto provider (mirrors app-core's own test setup).
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"

[[test]]
name = "record_perf"
path = "tests/record_perf.rs"
# Same main-thread requirement as the visual tier (VisualTestAppContext + AppKit).
harness = false

[[test]]
name = "visual"
path = "tests/visual.rs"
# Skip libtest's worker-thread harness — VisualTestAppContext talks to AppKit
# and must run on the main thread. With `harness = false` the test binary's
# `fn main()` runs directly, on whatever thread cargo invokes it on (the OS
# main thread for `cargo test --test visual` on macOS).
harness = false
