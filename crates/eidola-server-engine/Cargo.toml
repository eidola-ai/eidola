[package]
name = "eidola-server-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[features]
# The CUDA executor (`eidola-engine-cuda`): `EXECUTOR=cuda` parses only in
# a build with this feature. The driver is loaded at run time, so the feature builds on
# a machine without CUDA.
# It also loads the driver's NVML (`libloading`, already in the graph through the
# executor's driver loader) for the GPU confidential-computing check.
cuda = ["dep:eidola-engine-cuda", "dep:libloading"]

[[bin]]
name = "eidola-server-engine"
path = "src/main.rs"

[dependencies]
# The wire contract shared with clients and the gateway (the cache key's shape,
# the weights header), and the grammar of this node's measured configuration
# the gateway checks its pins with (`engine_deployment`).
eidola-common = { path = "../eidola-common" }
eidola-engine = { path = "../eidola-engine" }
eidola-engine-chat = { path = "../eidola-engine-chat" }
eidola-engine-cpu = { path = "../eidola-engine-cpu" }
eidola-engine-cuda = { path = "../eidola-engine-cuda", optional = true }
eidola-engine-model = { path = "../eidola-engine-model" }
# The OTLP pipeline Eidola's servers share (`telemetry.rs`).
eidola-telemetry = { path = "../eidola-telemetry" }

axum = "0.8"
base64 = "0.23"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
# `_exit`, for the watchdog's exit that waits on nothing (`worker::exit_stalled`).
libc = "0.2"
libloading = { version = "0.9", optional = true }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-appender-tracing = "0.33"
# The OTLP exporters' TLS: pure-Rust crypto and the bundled Mozilla roots, as the gateway's.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.1.0-pre.0"
webpki-roots = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
# Raising the memory-lock limit for the host-tier test.
rustix = { version = "1", features = ["process"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
# Reading what the node's instruments export (`tests/telemetry.rs`).
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
tempfile = "3"
# Reading the node's chunked stream off a raw socket (`tests/server.rs`).
tokio = { version = "1", features = ["io-util"] }
