[package]
name = "eidola-server-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[features]
# The CUDA executor's seam: `EIDOLA_ENGINE_EXECUTOR=cuda` parses only in a build with
# this feature, and the executor itself is not implemented yet (boot refuses it).
cuda = []

[[bin]]
name = "eidola-server-engine"
path = "src/main.rs"

[dependencies]
# The wire contract shared with clients and the gateway (the cache key's shape,
# the weights header), and the grammar of this node's measured configuration
# the gateway checks its pins with (`engine_deployment`).
eidola-common = { path = "../eidola-common", features = ["argon2"] }
eidola-engine = { path = "../eidola-engine" }
eidola-engine-chat = { path = "../eidola-engine-chat" }
eidola-engine-cpu = { path = "../eidola-engine-cpu" }
eidola-engine-model = { path = "../eidola-engine-model" }

argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
tempfile = "3"
