[package]
name = "eidola-engine-cuda"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[dependencies]
# Driver API only, loaded at run time: no CUDA runtime, no NVRTC, nothing
# linked at build time, so the crate builds (and its GPU tests skip) on a
# machine without a GPU. The bindings are pinned to CUDA 13.0, the oldest
# driver API the engine targets (R580).
cudarc = { version = "0.19.10", default-features = false, features = [
    "std",
    "driver",
    "dynamic-loading",
    "cuda-13000",
] }
eidola-engine = { path = "../eidola-engine" }
eidola-engine-kernels = { path = "../eidola-engine-kernels" }
eidola-engine-model = { path = "../eidola-engine-model" }

[dev-dependencies]
eidola-engine-chat = { path = "../eidola-engine-chat" }
# The reference executor drafted steps are compared with on the GPU.
eidola-engine-cpu = { path = "../eidola-engine-cpu" }
serde_json = "1"

# The evaluator's scoring and comparison logic is unit-tested with the crate.
[[example]]
name = "eval"
path = "examples/eval.rs"
test = true

# The attention-invariance bench's host-side plans are unit-tested with the crate.
[[example]]
name = "attention_invariance"
path = "examples/attention_invariance.rs"
test = true

# No integer conversion may lose a value silently, in any target (library,
# tests, examples): counts and ids are converted with `try_from`.
[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
