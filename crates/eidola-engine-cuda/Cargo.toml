[package]
name = "eidola-engine-cuda"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[features]
# Dev-only: the whole DeepSeek-V4.1 model on one GPU with its routed experts cached from
# host memory (`ds::staged`). Never enabled by the node's image build; a test of this
# crate holds the release feature set to that.
dev-staged-experts = []

[dependencies]
# Driver API only, loaded at run time: no CUDA runtime, no NVRTC, nothing
# linked at build time, so the crate builds (and its GPU tests skip) on a
# machine without a GPU. The bindings are pinned to CUDA 13.0, the oldest
# driver API the engine targets (R580).
cudarc = { version = "0.19.10", default-features = false, features = [
    "std",
    "driver",
    "dynamic-loading",
    "cuda-13000",
] }
eidola-engine = { path = "../eidola-engine" }
eidola-engine-kernels = { path = "../eidola-engine-kernels" }
eidola-engine-model = { path = "../eidola-engine-model" }
zeroize = "1"

[dev-dependencies]
eidola-engine-chat = { path = "../eidola-engine-chat" }
# The reference executor drafted steps are compared with on the GPU.
eidola-engine-cpu = { path = "../eidola-engine-cpu" }
serde_json = "1"
# Decompresses the chat crate's tokenizer fixture in the two-GPU example's tests; already
# in the graph through the chat crate.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Loads the kernels' host-compiled bodies in the executor's host tests; already in the
# graph through `cudarc`.
libloading = "0.8"
# Raises the soft memory-lock limit for the reference executor's host-tier pools in the
# executor's tests; already in the graph through `eidola-engine-cpu`.
rustix = { version = "1", features = ["process"] }

# The evaluator's scoring and comparison logic is unit-tested with the crate.
[[example]]
name = "eval"
path = "examples/eval.rs"
test = true

# The released-weights measurement's flow is unit-tested on the fixture.
[[example]]
name = "ds_halves"
path = "examples/ds_halves.rs"
test = true

# The released checkpoint whole on one GPU, its experts staged.
[[example]]
name = "ds_whole"
path = "examples/ds_whole.rs"
required-features = ["dev-staged-experts"]
test = true

# The released checkpoint on two GPUs, every weight resident.
[[example]]
name = "ds_two"
path = "examples/ds_two.rs"
test = true

[[test]]
name = "ds_staged"
path = "tests/ds_staged.rs"
required-features = ["dev-staged-experts"]

# No integer conversion may lose a value silently, in any target (library,
# tests, examples): counts and ids are converted with `try_from`.
[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
