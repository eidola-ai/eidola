# A synthetic engine deployment, used by the gateway's engine-trust tests.
# Laid out as a real one is: deploy/engine/<name>/<variant>/. Decode graphs
# are on and three tokens are drafted a step, the production settings, so the
# KV budget here is checked with the pad block each pool keeps for graph
# replay and with the drafter pool.
cvm-version: 0.15.3-rc.1+gpu@sha256:1421cbb45dc428f6270d106d8eb68faab3ce7ca02ff2fbb2dc0968605004579f
cpus: 16
memory: 65536
gpus: 8

models:
  - name: "weights"
    repo: "example/fixture-model@4444444444444444444444444444444444444444"
    mpk: "5555555555555555555555555555555555555555555555555555555555555555_17419419648_3892cd2f-a06e-5aee-8276-93140b9f06ec"
    schema: 2

containers:
  - name: "eidola-server-engine"
    image: "ghcr.io/eidola-ai/eidola-server-engine@sha256:2222222222222222222222222222222222222222222222222222222222222222"
    runtime: nvidia
    models: ["weights"]
    gpus: all
    secrets:
      - ENGINE_GATEWAY_TOKEN
    env:
      - EIDOLA_ENV_PREFIX: "ENGINE_"
      - ENGINE_MODEL_ID: "3333333333333333333333333333333333333333333333333333333333333333"
      - ENGINE_WEIGHTS_DIR: "/tinfoil/models/weights"
      - ENGINE_WEIGHTS_SHA256: "3333333333333333333333333333333333333333333333333333333333333333"
      - ENGINE_WEIGHTS_STORAGE: "verified-readonly"
      - ENGINE_EXECUTOR: "cuda"
      - ENGINE_BIND_ADDR: "0.0.0.0:8080"
      - ENGINE_KV_BLOCK_SIZE: "16"
      - ENGINE_KV_DEVICE_BYTES: "68719476736"
      - ENGINE_KERNELS_DIR: "/opt/eidola/kernels"
      - ENGINE_CUDA_GRAPHS: "on"
      - ENGINE_GPU_CC: "required"
      - ENGINE_MAX_MODEL_LEN: "131072"
      - ENGINE_MAX_SEQS: "64"
      - ENGINE_MAX_BATCHED_TOKENS: "8192"
      - ENGINE_MAX_PREFILL_CHUNK: "4096"
      - ENGINE_DRAFT_TOKENS: "3"
      - ENGINE_MAX_REQUESTS: "8"
      - ENGINE_PREFIX_CACHE: "true"
      - ENGINE_CACHE_IDLE_TTL_SECS: "900"
      - ENGINE_CACHE_MAX_AGE_SECS: "7200"
      - ENGINE_KV_HOST_BYTES: "34359738368"

shim:
  upstream-port: 8080
  paths:
    - /*
