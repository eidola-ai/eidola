[package]
name = "eidola-i18n"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
# With Eidola, Inc.'s additional permission for app stores, named below
# (LICENSE.md → App stores).
license = "GPL-3.0-only"

[features]
# The build-script half: an app's `build.rs` depends on this crate with
# `default-features = false, features = ["codegen"]`.
codegen = ["dep:fluent-syntax", "dep:unic-langid"]
# The runtime half, for the app itself.
runtime = ["dep:fluent-bundle", "dep:unic-langid"]

[dependencies]
fluent-bundle = { version = "0.16", optional = true }
fluent-syntax = { version = "0.12", optional = true }
unic-langid = { version = "0.9", optional = true }

# The licence REUSE.toml declares for this crate: Cargo takes SPDX list
# identifiers only. crates/mobile-licences reads it for the app's licences.
[package.metadata.eidola]
licence = "LicenseRef-Eidola-GPL-3.0-only-with-app-store-permission"
