[package]
# Pins the Rust-based developer tools. Each tool is an exact `=X.Y.Z`
# dependency, so this crate's own `Cargo.lock` pins its whole graph. This is
# a separate workspace (the root excludes it), so the tools' graphs never
# enter the product's lockfile, its `cargo-deny` gate or its Nix checks.
# `.envrc` builds each tool by package name into this workspace's
# `target/debug/` and direnv puts that on `PATH`:
#
#   cargo build --manifest-path crates/devtools/Cargo.toml -p just
#
# Only crates with a `lib` target can be pinned this way (a bin-only crate
# cannot be a dependency). The package name differs from every tool so
# `-p <tool>` resolves to the registry crate. Adding a tool is a dependency
# here plus a `-p <tool>` in `.envrc`.
name = "eidola-devtools"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
rumdl = "=0.3.5"
just = "=1.59.0"
cargo-deny = "=0.20.2"

[workspace]

# The tools run on every `just check`; optimized dependencies keep
# cargo-deny's whole-graph walk quick, as in the root workspace.
[profile.dev.package."*"]
opt-level = 2
