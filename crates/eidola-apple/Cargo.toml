[package]
name = "eidola-apple"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"
description = "Cross-platform detached Apple code-signature format, placement, and inspection"

[dependencies]
plist = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
