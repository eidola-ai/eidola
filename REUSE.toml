# REUSE (https://reuse.software) licensing declarations for this repository.
# Licenses are declared here by path rather than as per-file SPDX headers.
# Per the REUSE specification, when multiple annotations cover the same file,
# the one declared later in this file takes precedence — so the repository-wide
# default comes first and narrower declarations follow.
#
# LICENSE.md is the human-readable map of the same information.

version = 1
SPDX-PackageName = "eidola"
SPDX-PackageDownloadLocation = "https://github.com/eidola-ai/eidola"

# Repository-wide default: everything not covered by a later annotation.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "© Eidola, Inc. and contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Server layer.
[[annotations]]
path = [
    "crates/eidola-server/**",
    "crates/eidola-engine/**",
    "crates/eidola-engine-model/**",
    "crates/eidola-engine-chat/**",
    "crates/eidola-engine-kernels/**",
    "crates/eidola-engine-cpu/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "© Eidola, Inc. and contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# App layer.
[[annotations]]
path = [
    "crates/eidola-app-core/**",
    "crates/eidola-cli/**",
    "crates/eidola-gui/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "© Eidola, Inc. and contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# Cross-platform detached Apple-signature contract (explicitly permissive
# because it is intended for independent verifiers and downstream consumers).
[[annotations]]
path = "crates/eidola-apple/**"
precedence = "closest"
SPDX-FileCopyrightText = "© Eidola, Inc. and contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Documentation and website content (the site generator crate stays under the
# repository default above).
[[annotations]]
path = ["docs/**", "www/**"]
precedence = "closest"
SPDX-FileCopyrightText = "© Eidola, Inc. and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Legal instruments of Eidola, Inc.: published for transparency, not reuse.
[[annotations]]
path = [
    "www/pages/terms.md",
    "www/pages/privacy.md",
    "CLA-INDIVIDUAL.md",
    "CLA-CORPORATE.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "© Eidola, Inc."
SPDX-License-Identifier = "LicenseRef-Eidola-Legal"

# Verbatim files from the MiMo-V2.6 model release (Hugging Face
# XiaomiMiMo/MiMo-V2.6-Flash-MOPD, declared MIT), kept as test fixtures.
[[annotations]]
path = [
    "crates/eidola-engine-chat/tests/fixtures/chat_template.jinja",
    "crates/eidola-engine-chat/tests/fixtures/generation_config.json",
    "crates/eidola-engine-chat/tests/fixtures/tokenizer.json.gz",
]
precedence = "closest"
SPDX-FileCopyrightText = "© 2026 Xiaomi Corporation"
SPDX-License-Identifier = "MIT"

# Verbatim config.json files from the MiMo-V2.6 model releases (Hugging Face
# XiaomiMiMo/MiMo-V2.6-Flash-MOPD and MiMo-V2.6-Pro-MOPD, declared MIT), kept as
# test data.
[[annotations]]
path = [
    "crates/eidola-engine-model/tests/data/flash-mopd.config.json",
    "crates/eidola-engine-model/tests/data/pro-mopd.config.json",
]
precedence = "closest"
SPDX-FileCopyrightText = "© 2026 Xiaomi Corporation"
SPDX-License-Identifier = "MIT"

# Test fixtures generated from the MiMo-V2.6 template and tokenizer.
[[annotations]]
path = [
    "crates/eidola-engine-chat/tests/fixtures/template_cases.json",
    "crates/eidola-engine-chat/tests/fixtures/template_token_ids.json",
]
precedence = "closest"
SPDX-FileCopyrightText = ["© Eidola, Inc. and contributors", "© 2026 Xiaomi Corporation"]
SPDX-License-Identifier = "AGPL-3.0-only AND MIT"

# Verbatim sample TDX quote and Intel collateral from the dcap-qvl crate
# (declared MIT), kept as test fixtures; and the Intel SGX root certificate,
# byte-identical to dcap-qvl's copy of Intel's published root.
[[annotations]]
path = [
    "crates/tinfoil-verifier/tests/fixtures/dcap-qvl/tdx_quote",
    "crates/tinfoil-verifier/tests/fixtures/dcap-qvl/tdx_quote_collateral.json",
    "crates/tinfoil-verifier/src/intel_sgx_root_ca.der",
]
precedence = "closest"
SPDX-FileCopyrightText = "© 2026 Phala Network"
SPDX-License-Identifier = "MIT"
